<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Command Electric Deal Hunter</title>
  <link rel="stylesheet" href="styles.css">

  </div>

  <script src="app.js"></script>

</html>
